name: Leistungsnachweis Sync
 
on:
  schedule:
    - cron: "0 19 * * 1-5"  # täglich Mo–Fr 21:00 Uhr Europe/Berlin (= 19:00 UTC)
  workflow_dispatch:          # manueller Trigger als Fallback
    inputs:
      backfill:
        description: "Einmaliger Nachtrag: Tätigkeit auf bestehenden Items nachtragen (statt Sync)"
        type: boolean
        default: false
 
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # für den Keepalive-Commit (hält den Scheduler aktiv)

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4
 
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Abhängigkeiten installieren
        run: pip install requests
 
      - name: Leistungsnachweis synchronisieren
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python leistungsnachweis_sync.py --backfill-taetigkeit
          else
            python leistungsnachweis_sync.py
          fi
 
      - name: Ergebnis im Log festhalten
        if: always()
        run: echo "Sync abgeschlossen – $(date '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Keepalive – Repo aktiv halten
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "Letzter Commit vor $DAYS Tagen."
          # GitHub deaktiviert geplante Workflows nach 60 Tagen Repo-Inaktivität.
          # Alle 50 Tage ein leerer Commit setzt den Zähler zurück (triggert selbst keinen Lauf).
          if [ "$DAYS" -ge 50 ]; then
            git commit --allow-empty -m "chore: keepalive – Scheduler aktiv halten"
            git push
            echo "Keepalive-Commit gesetzt."
          else
            echo "Kein Keepalive nötig."
          fi
